[project]
name = "store-analytics-agent"
version = "0.1.0"
description = "LLM agent for store analytics with evaluation & observability layer"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.13.0",
    "mistralai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "dotenv>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
