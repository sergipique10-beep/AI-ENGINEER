name: Agent Evals Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database
        run: python -c "from src.store_analytics.db.seed import seed_database; from src.store_analytics.config import DATABASE_PATH; seed_database(DATABASE_PATH)"

      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/run_evals.py --dataset data/golden.json --output data/eval_results.json

      - name: Gate check
        run: python scripts/gate.py --results data/eval_results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval_results.json
          retention-days: 30
